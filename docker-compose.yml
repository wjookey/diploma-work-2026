services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educrm}
      POSTGRES_DB: ${POSTGRES_DB:-educrm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-educrm} -d ${POSTGRES_DB:-educrm}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Переопределения только для Docker (остальное — из backend/.env)
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-educrm}:${POSTGRES_PASSWORD:-educrm}@db:5432/${POSTGRES_DB:-educrm}?schema=public}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  postgres_data:
